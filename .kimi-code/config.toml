# Put this config to: ~/.kimi-code/config.toml

# PLUGINS: - Install manually in TUI:
# /plugins install https://github.com/obra/superpowers

# Then run /reload or start a new session.

default_permission_mode = "yolo"
default_model = "kimi-code/kimi-for-coding"

[thinking]
enabled = true
effort = "low"

[secondary_model]
default_model = "orcarouter"

[providers."managed:kimi-code"]                                                                                       
type = "kimi"                                                                                                         
base_url = "https://api.kimi.ai/coding/v1"                                                                            
api_key_env = "KIMI_CODE_API_KEY"

[providers.orcarouter]
type = "openai"
base_url = "https://api.orcarouter.ai/v1"
api_key_env = "ORCAROUTER_API_KEY"

[models.orcarouter]
provider = "orcarouter"
model = "deepseek/deepseek-v4.1-flash-free"
display_name = "DeepSeek Flash (orca)"
max_context_size = 200000

[models."kimi-code/kimi-for-coding".overrides]
max_context_size = 262144
capabilities = [ "thinking", "image_in", "video_in", "tool_use", "dynamically_loaded_tools"]
display_name = "K2.8 Pre256k"
default_effort = "low"

